name: Weekly seed refresh

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          npm run seed
          kill $SERVER_PID
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/seeded-games.json
          git diff --cached --quiet || git commit -m "Weekly seed refresh: top-100 verdict snapshot"
          git push
